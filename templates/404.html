<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — The Loop</title>
  <style>
    :root { --bg:#0b0d12; --card:#14171f; --text:#e6e9ef; --text-faint:#8b93a7; --accent:#7c6cf6; --border:#232838; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:var(--bg); color:var(--text); font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    .wrap { text-align:center; padding:32px; }
    .loop { display:inline-flex; align-items:center; gap:10px; color:var(--accent); font-weight:700; font-size:20px; margin-bottom:18px; }
    .code { font-size:72px; font-weight:800; letter-spacing:-0.03em; margin:0; }
    .msg { color:var(--text-faint); margin:8px 0 24px; }
    a.home { display:inline-block; background:var(--accent); color:#0b0d12; font-weight:700;
             padding:10px 18px; border-radius:10px; text-decoration:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="loop">&#8635; The Loop</div>
    <p class="code">404</p>
    <p class="msg">That page doesn't exist. Head back to your dashboard.</p>
    <a class="home" href="/">Go to The Loop</a>
  </div>
</body>
</html>
